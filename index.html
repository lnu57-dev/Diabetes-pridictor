<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background-color: #fff;
            padding: 30px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        h2 {
            text-align: center;
        }
        .result {
            background-color: #e7f3fe;
            padding: 15px;
            border-left: 6px solid #2196F3;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Diabetes Prediction</h2>
        <form action="/predict" method="post">
            <label>Pregnancies:</label>
            <input type="text" name="pregnancies" required>

            <label>Glucose Level:</label>
            <input type="text" name="glucose" required>

            <label>Blood Pressure:</label>
            <input type="text" name="bloodpressure" required>

            <label>Skin Thickness:</label>
            <input type="text" name="skinthickness" required>

            <label>Insulin:</label>
            <input type="text" name="insulin" required>

            <label>BMI:</label>
            <input type="text" name="bmi" required>

            <label>Diabetes Pedigree Function:</label>
            <input type="text" name="dpf" required>

            <label>Age:</label>
            <input type="text" name="age" required>

            <input type="submit" value="Predict">
        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}
    </div>
</body>
</html>
