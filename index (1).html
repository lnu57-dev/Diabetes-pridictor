
<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>
</head>
<body>
    <h1>Diabetes Prediction</h1>
    <form id="predictForm">
        Pregnancies: <input type="number" name="pregnancies" required><br>
        Glucose: <input type="number" name="glucose" required><br>
        Blood Pressure: <input type="number" name="bloodpressure" required><br>
        SkinThickness: <input type="number" name="skinthickness" required><br>
        Insulin: <input type="number" name="insulin" required><br>
        BMI: <input type="number" name="bmi" required><br>
        DiabetesPedigreeFunction: <input type="number" step="0.01" name="dpf" required><br>
        Age: <input type="number" name="age" required><br>
        <button type="submit">Predict</button>
    </form>
    <p id="result"></p>
    <script src="app.js"></script>
</body>
</html>
